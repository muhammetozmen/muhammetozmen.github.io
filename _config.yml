title: Muhammet Özmen
description: "Muhammet Özmen: gömülü sistemler ve bilgisayar mühendisi. Portfolyo, projeler ve yazılar."
description_en: "Muhammet Özmen: embedded systems and computer engineer. Portfolio, projects and writing."
# Arama motorları ve yapay zeka sistemleri için anahtar kelimeler (yalnızca gerçekten sitede olan konular).
# Sayfa front matter'ında `keywords:` ile ezilebilir.
keywords: "Muhammet Özmen, gömülü sistemler, embedded systems, bilgisayar mühendisi, computer engineer, portfolyo, portfolio, Jetson Nano, Raspberry Pi, Qt, Python, C++, Teknofest"
# Alan adı mozmen.dev (CNAME dosyası + url). DNS ve Pages özel alan adı ayarı kullanıcıda: CLAUDE.md §10.
url: "https://mozmen.dev"
baseurl: ""
lang: tr
timezone: Europe/Istanbul
author: Muhammet Özmen

permalink: /yazilarim/:year/:title/

collections:
  projects:
    output: true
    permalink: /projelerim/:name/
  portfolio:
    output: false   # öğeler /portfolyom/ sayfasında açık gösterilir, ayrı sayfaları yok

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: item }

plugins:
  - jekyll-feed

feed:
  path: feed.xml

# Yayınlanmayacak dosyalar
exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - playwright.config.js
  - node_modules
  - tests
  - vendor
  - _reference
  - README.md
