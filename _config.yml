title: "Muhammet Özmen"
description: "Gömülü Sistemler ve Bilgisayar Mühendisi | Embedded & Computer Engineer"
url: "https://muhammetozmen.org"
baseurl: ""
author: "Muhammet Özmen"
logo: "/assets/img/og-image.png"

social:
  name: Muhammet Özmen
  links:
    - https://github.com/muhammetozmen
    - https://linkedin.com/in/muhammetozmen/
    - https://www.youtube.com/@ozmen-muhammet

twitter:
  username: muhammetozmen

permalink: /posts/:title/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:title/

sass:
  sass_dir: assets/scss

defaults:
  - scope:
      path: "_posts/blog"
      type: posts
    values:
      layout: blog
      category: blog
  - scope:
      path: "_posts/devlogs"
      type: posts
    values:
      layout: blog
      category: devlog
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "pages"
    values:
      paired_pages:
        home:     { en: "/en/",      tr: "/" }
        resume:   { en: "/en/resume", tr: "/resume" }
        projects: { en: "/en/projects", tr: "/projects" }

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENT.MD
  - node_modules
  - vendor
  - .bundle
