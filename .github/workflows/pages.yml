# Önce testler koşar; yalnızca main'de ve testler geçerse yayınlanır.
name: Build, test, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın: yeni push eskisini iptal eder
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # CI'da sistem Chromium'u yok; Playwright kendi tarayıcısını kurar
      - run: npx playwright install --with-deps chromium

      # Testler baseurl="" ile kendi sunucusunu (jekyll serve) açar
      - run: npx playwright test

      - id: pages
        uses: actions/configure-pages@v6.0.0

      # Yayın derlemesi, Pages'in verdiği base_path ile (özel domainde boş gelir)
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0

      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-sonuclar
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
